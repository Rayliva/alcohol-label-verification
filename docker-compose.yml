# The one-command path for booting the stack:
#
#   AGENT_USERNAME=agent AGENT_PASSWORD=... ANTHROPIC_API_KEY=sk-ant-... docker compose up
#
# Serves the API and the UI at http://localhost:8000 with OCR_ENGINE=fake, so
# no Cloud Vision account is needed and no OCR traffic leaves the machine.
#
# Two limits, both real, both in the README under Limitations rather than left
# as a surprise:
#
#   1. The Anthropic key is required even here. OCR_ENGINE=fake covers OCR
#      only; extraction always calls the model, so without a key the container
#      starts, /health carries a note saying so (status stays ok — the
#      missing key is not actionable by the container), and checks fail.
#   2. fake OCR returns one built-in sample label for every image. A check run
#      this way reports on that sample, not on the artwork uploaded. It proves
#      the stack is wired together; it does not demonstrate the product. For
#      that, use OCR_ENGINE=cloud with credentials, or the deployed instance.
#
# This is not the daily development workflow — that is `uv run uvicorn
# app.main:app --reload` in api/, because the reload loop is faster and that is
# where the hours go. See docs/tech-spec.md 11.

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # A built-in sample label rather than a provider — the same text for
      # every image (api/app/ocr/fake.py). Covers OCR only; see the note above.
      OCR_ENGINE: fake
      LOG_LEVEL: INFO
      # Credentials are injected at runtime, never baked into the image
      # (.claude/rules/secrets.md). The Cloud Vision one is genuinely optional
      # here; the Anthropic one is not — see the note above.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The app will not start without these — see .env.example.
      AGENT_USERNAME: ${AGENT_USERNAME:-}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
