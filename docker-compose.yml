# The one-command reviewer path.
#
#   docker compose up
#
# Runs the whole stack with deterministic OCR fixtures: no API keys, no
# outbound network, no accounts to create. The UI is served from the same
# container at http://localhost:8000.
#
# This is not the daily development workflow — that is `uv run uvicorn
# app.main:app --reload` in api/, because the reload loop is faster and that is
# where the hours go. See docs/tech-spec.md 11.

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Fixtures rather than a provider. Everything works; the text comes from
      # corpus/fixtures instead of from Cloud Vision.
      OCR_ENGINE: fake
      LOG_LEVEL: INFO
      # Credentials are injected at runtime, never baked into the image
      # (.claude/rules/secrets.md). Both are optional in this mode: without an
      # Anthropic key, startup skips the warming calls and /health says so.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
