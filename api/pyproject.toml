[project]
name = "label-verification-api"
version = "0.1.0"
description = "Verifies alcohol label artwork against declared TTB COLA application data"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Deferred until the phases that need them — opencv is a large download
# and is not required for the Phase 0 spike or the rule engine.
server = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12"]
vision = ["opencv-python-headless>=4.10", "numpy>=2.1"]
cloud-ocr = ["google-cloud-vision>=3.8"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The substitution table is deliberately full of ambiguous typographic
# characters - mapping them to ASCII is its entire purpose.
"app/rules/normalize.py" = ["RUF001"]
# Same reason: these tests assert that curly quotes, en dashes and non-breaking
# spaces normalise away. The ambiguous character IS the fixture.
"tests/unit/rules/test_normalize.py" = ["RUF001"]
"tests/unit/rules/test_match_text.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# The rule engine and extraction layer are the correctness-critical code.
module = ["app.rules.*", "app.extraction.*"]
disallow_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "accuracy: corpus accuracy suite (slow; asserts the >=95% target)",
    "live: requires real API credentials and network access",
]
